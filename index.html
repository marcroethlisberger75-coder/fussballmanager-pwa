<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Fussball Manager 26/27</title>
<meta name="description" content="Amiga-Bundesliga-Manager-Stil: von der Oberliga bis zur Bundesliga — mit Aufstieg, Abstieg, Transfers, Pokal und Europapokal." />
<meta name="theme-color" content="#0b1f14" />

<link rel="manifest" href="manifest.json" />
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png" />
<link rel="icon" href="favicon-16.png" sizes="16x16" type="image/png" />
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Fussball Manager" />
<meta name="mobile-web-app-capable" content="yes" />

<!-- Tailwind (Play-CDN, JIT im Browser — kein Build-Schritt nötig) -->
<script src="https://cdn.tailwindcss.com"></script>

<!-- React/ReactDOM/lucide-react als ESM direkt aus dem CDN, damit app.jsx unverändert die
     gewohnten "import ... from react/lucide-react" Statements benutzen kann. -->
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.3.1",
    "react-dom/client": "https://esm.sh/react-dom@18.3.1/client?external=react",
    "lucide-react": "https://esm.sh/lucide-react@0.383.0?external=react"
  }
}
</script>

<!-- Babel Standalone: transformiert die JSX-Datei direkt im Browser (kein Build-Schritt). -->
<script src="https://unpkg.com/@babel/standalone@7.26.4/babel.min.js"></script>

<style>
  html, body { height: 100%; margin: 0; background: #050e08; }
  #root { min-height: 100%; }
  #boot-loading {
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    color: #6ee7b7; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 14px;
    background: linear-gradient(135deg, #050e08 0%, #0b1f14 35%, #123322 65%, #08160e 100%);
  }
</style>
</head>
<body>
<div id="root"><div id="boot-loading">Lade Fussball Manager …</div></div>

<script type="text/babel" data-type="module" data-presets="react" src="app.jsx"></script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch((err) => console.error("SW-Registrierung fehlgeschlagen:", err));
    });
    // Sobald ein neuer Service Worker die Kontrolle übernimmt (nach einem Update), die Seite EINMAL
    // automatisch neu laden — sonst müsste man die App bisher komplett schliessen und neu öffnen,
    // bevor eine aktualisierte app.jsx überhaupt zum Einsatz kommt.
    let hatBereitsNeuGeladen = false;
    navigator.serviceWorker?.addEventListener("controllerchange", () => {
      if (hatBereitsNeuGeladen) return;
      hatBereitsNeuGeladen = true;
      window.location.reload();
    });
  }
</script>
</body>
</html>
